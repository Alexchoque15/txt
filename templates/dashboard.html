{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card text-center shadow">
            <div class="card-body">
                <i class="bi bi-box-seam fs-1"></i>
                <h4>Total Productos</h4>
                <p class="fs-3">{{ total }}</p>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card text-center shadow">
            <div class="card-body">
                <i class="bi bi-bar-chart fs-1"></i>
                <h4>Stock Total</h4>
                <p class="fs-3">{{ stock_total }}</p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
