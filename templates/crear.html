{% extends 'base.html' %}
{% block content %}

<h2>Registrar Producto</h2>

<form method="POST" class="card p-4 shadow">

    <div class="mb-3">
        <label class="form-label">Nombre del producto</label>
        <input name="nombre" class="form-control" placeholder="Ej: Laptop Lenovo IdeaPad 3" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select name="categoria" class="form-select" required>
            <option value="">Seleccione una categoría</option>
            <option>Computadoras</option>
            <option>Laptops</option>
            <option>Periféricos</option>
            <option>Accesorios</option>
            <option>Componentes</option>
            <option>Redes</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Precio (Bs)</label>
        <input name="precio" type="number" min="0.01" step="0.01" class="form-control" placeholder="Ej: 3500.00" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Stock</label>
        <input name="stock" type="number" min="0" class="form-control" placeholder="Ej: 10" required>
    </div>

    <button class="btn btn-primary w-100">
        <i class="bi bi-save"></i> Guardar Producto
    </button>

</form>

{% endblock %}
