{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Productos</h2>
    <a href="/crear" class="btn btn-success">
        <i class="bi bi-plus-circle"></i> Nuevo
    </a>
</div>

<form method="GET" class="mb-3 d-flex">
    <input type="text" name="buscar" class="form-control me-2" placeholder="Buscar...">
    <button class="btn btn-primary">
        <i class="bi bi-search"></i>
    </button>
</form>

<table class="table table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for p in productos %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.categoria }}</td>
            <td>{{ p.precio }}</td>
            <td>{{ p.stock }}</td>
            <td>
                <a href="/editar/{{ p.id }}" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i></a>
                <a href="/eliminar/{{ p.id }}" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
