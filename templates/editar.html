{% extends 'base.html' %}

{% block content %}
<h2 class="fw-semibold mb-3">
    <i class="bi bi-pencil-square"></i> Editar Producto
</h2>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input name="nombre" value="{{ producto.nombre }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <input name="categoria" value="{{ producto.categoria }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input name="precio" value="{{ producto.precio }}" type="number" step="0.01" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Stock</label>
                <input name="stock" value="{{ producto.stock }}" type="number" class="form-control" required>
            </div>

            <button class="btn btn-primary">
                <i class="bi bi-arrow-repeat"></i> Actualizar
            </button>
        </form>
    </div>
</div>
{% endblock %}
